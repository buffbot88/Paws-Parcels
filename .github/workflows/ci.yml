name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated test configuration
        run: cp server_config.test.example.json server_config.json

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate content
        run: npm run validate

      - name: Build
        run: npm run build
