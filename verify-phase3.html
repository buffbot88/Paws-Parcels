<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERIFICATION RUNNING</title>
  <style>
    body { background: #222; color: #eee; font-family: monospace; }
    pre { white-space: pre-wrap; padding: 12px; }
  </style>
</head>  <body>
    <div id="game-container" style="position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;">
      <div id="ui-overlay"></div>
    </div>
<pre id="result">starting…</pre>
<script type="module">
  const out = document.getElementById("result");
  const log = (msg) => { out.textContent += "\n" + msg; };
  const fail = (msg) => { out.textContent += "\nFAIL: " + msg; };
  window.addEventListener("error", (e) => fail("window error: " + e.message));
  window.addEventListener("unhandledrejection", (e) => fail("unhandled rejection: " + e.reason));

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Import the real game entry so the app boots exactly like production.
  try {
    await import("/src/main.ts");
    log("imported main.ts");
  } catch (e) {
    fail("import failed: " + e);
    throw e;
  }
  const game = window.game;
  if (!game) fail("window.game is undefined");

  // Manual frame pump: the verification tab can get backgrounded, which pauses
  // Phaser's loop. Let Phaser drive its own loop once booted; only step manually
  // when the game is paused (hidden tab) so the scene keeps progressing.
  const pump = () => {
    if (!game.isBooted) return; // never step before the renderer exists
    if (game.isPaused) {
      game.resume();
      if (typeof game.step === "function") game.step(performance.now(), 16.67);
    }
  };
  setInterval(pump, 16);

  const overworld = () => game.scene.getScene("overworld");
  const panel = () => document.querySelector(".dialogue-panel");
  const panelText = () => document.querySelector(".dialogue-speaker")?.textContent ?? "(none)";
  const panelOpen = () => panel() && !panel().classList.contains("hidden");

  const waitFor = async (label, fn, timeoutMs = 20000) => {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      try { if (fn()) { log(`OK ${label}`); return true; } } catch { /* scene mid-restart */ }
      pump();
      await sleep(50);
    }
    fail(`timeout waiting for ${label}`);
    return false;
  };

  const teleport = (scene, tileX, tileY) => {
    scene.player.setPosition(tileX * 48 + 24, tileY * 48 + 24);
  };

  const pressE = () => {
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "e", code: "KeyE", keyCode: 69, bubbles: true }));
    window.dispatchEvent(new KeyboardEvent("keyup", { key: "e", code: "KeyE", keyCode: 69, bubbles: true }));
  };

  // ---------- boot ----------
  await waitFor("game booted (overworld active)", () => overworld() && overworld().isActive());
  await sleep(600);

  const scene = overworld();
  const targets = scene.interactionSystem.targets;
  const npcCount = targets.filter((t) => t.kind === "npc").length;
  const objectCount = targets.filter((t) => t.kind !== "npc").length;
  log(`post office targets: ${npcCount} npc(s), ${objectCount} object(s) — expect 1 and 5`);

  // ---------- Pip dialogue ----------
  teleport(scene, 6, 4); // floor behind the counter, adjacent to Pip at (5,4)
  await sleep(400);
  log(`prompt visible near Pip: ${scene.prompt.visible}`);

  pressE();
  await sleep(300);
  log(`dialogue open: ${panelOpen()} | speaker: ${panelText()} (expect Pip)`);
  const firstLine = document.querySelector(".dialogue-text")?.textContent ?? "";
  log(`line 1: "${firstLine}"`);

  // Dialogue should pause the player: hold D during dialogue, position must not change.
  const xBefore = scene.player.x;
  window.dispatchEvent(new KeyboardEvent("keydown", { key: "d", code: "KeyD", keyCode: 68, bubbles: true }));
  await sleep(500);
  window.dispatchEvent(new KeyboardEvent("keyup", { key: "d", code: "KeyD", keyCode: 68, bubbles: true }));
  await sleep(100);
  log(`player frozen during dialogue: ${Math.abs(scene.player.x - xBefore) < 1} (moved ${(scene.player.x - xBefore).toFixed(1)}px)`);

  // Advance through all lines (3 for Pip greeting) then it should close.
  pressE(); await sleep(250);
  const line2 = document.querySelector(".dialogue-text")?.textContent ?? "";
  log(`line 2: "${line2}"`);
  pressE(); await sleep(250);
  const line3 = document.querySelector(".dialogue-text")?.textContent ?? "";
  log(`line 3: "${line3}"`);
  pressE(); await sleep(300);
  log(`dialogue closed after last line: ${!panelOpen()}`);

  // ---------- Mailbox ----------
  teleport(scene, 5, 12); // adjacent above mailbox at (5,13)
  await sleep(400);
  pressE();
  await sleep(300);
  log(`mailbox speaker: ${panelText()} (expect Mailbox)`);
  log(`mailbox line: "${document.querySelector(".dialogue-text")?.textContent ?? ""}"`);
  pressE(); await sleep(300);
  log(`mailbox closed: ${!panelOpen()}`);

  // ---------- Welcome sign ----------
  teleport(scene, 13, 18);
  await sleep(400);
  pressE();
  await sleep(300);
  log(`sign speaker: ${panelText()} (expect Welcome Sign)`);
  pressE(); await sleep(300);
  log(`sign closed: ${!panelOpen()}`);

  // ---------- Zone transition to Bramble Patch ----------
  teleport(scene, 15, 19);
  await waitFor("transitioned to bramble (zone label change)", () => {
    const s = overworld();
    return s && s.mapData && s.mapData.id === "zone-bramble-patch";
  });
  await sleep(600);

  const scene2 = overworld();
  const t2 = scene2.interactionSystem.targets;
  log(`bramble targets: ${t2.filter((x) => x.kind === "npc").length} npc(s), ${t2.filter((x) => x.kind !== "npc").length} object(s) — expect 4 and 1`);

  // ---------- Talk to Biscuit ----------
  teleport(scene2, 34, 7); // grass beside Biscuit at (33,7)
  await sleep(400);
  log(`prompt visible near Biscuit: ${scene2.prompt.visible}`);
  pressE();
  await sleep(300);
  log(`biscuit speaker: ${panelText()} (expect Biscuit)`);
  pressE(); await sleep(250);
  pressE(); await sleep(250);
  pressE(); await sleep(300);
  log(`biscuit dialogue closed: ${!panelOpen()}`);

  // ---------- Walk north back to the post office (transition reverse) ----------
  teleport(scene2, 19, 1);
  await waitFor("transitioned back to post office", () => {
    const s = overworld();
    return s && s.mapData && s.mapData.id === "zone-post-office";
  });

  document.title = "VERIFICATION COMPLETE";
  log("VERIFICATION COMPLETE");
</script>
</body>
</html>
